<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mula Inventory System v1.2.0</title>
  
  <!-- External Libraries (Shared) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Open Sans', sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      min-height: 100vh;
    }
    
    /* Sidebar Navigation */
    .sidebar {
      width: 250px;
      background: #fff;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.3s ease;
      z-index: 1000;
    }
    
    .sidebar-header {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .sidebar-header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #4CAF50;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .sidebar-header h1 i {
      font-size: 24px;
    }
    
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 30px;
    }
    
    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      border-radius: 8px;
      color: #666;
      text-decoration: none;
      font-weight: 500;
      font-family: 'Open Sans', sans-serif;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .nav-link:hover {
      background: #f9f9f9;
      color: #4CAF50;
    }
    
    .nav-link.active {
      background: #4CAF50;
      color: white;
    }
    
    .nav-link i {
      width: 20px;
      text-align: center;
    }
    
    .quick-actions {
      margin-top: 20px;
    }
    
    .quick-actions h3 {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      margin-bottom: 15px;
    }
    
    .quick-action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: white;
      color: #666;
      font-weight: 500;
      font-family: 'Open Sans', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 8px;
    }
    
    .quick-action-btn:hover {
      background: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }
    
    .quick-action-btn i {
      width: 18px;
    }
    
    .sidebar-profile {
      margin-top: auto;
      padding-top: 20px;
      border-top: 2px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .profile-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #4CAF50;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
    }
    
    .profile-info h4 {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    
    .profile-info p {
      font-size: 12px;
      color: #999;
    }
    
    /* Main Content Area */
    .main-content {
      margin-left: 250px;
      padding: 30px;
      flex: 1;
      overflow-y: auto;
    }
    
    /* Notifications */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: 8px;
      font-family: 'Open Sans', sans-serif;
      font-size: 14px;
      z-index: 3000;
      display: none;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    .notification.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #4CAF50;
    }
    
    .notification.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #F44336;
    }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .loading i {
      font-size: 48px;
      margin-bottom: 15px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .modal-header h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }
    
    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: #999;
      cursor: pointer;
      padding: 5px;
    }
    
    .close-btn:hover {
      color: #333;
    }
    
    /* Mobile Menu Button */
    .mobile-menu-btn {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1001;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 20px;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      
      .sidebar.active {
        transform: translateX(0);
      }
      
      .main-content {
        margin-left: 0;
      }
      
      .mobile-menu-btn {
        display: block;
      }
    }
    
    @media (min-width: 769px) {
      .mobile-menu-btn {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Mobile Menu Button -->
  <button class="mobile-menu-btn" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
  </button>
  
  <!-- Notification -->
  <div id="notification" class="notification"></div>
  
  <!-- Loading -->
  <div id="loading" class="loading" style="display: none;">
    <i class="fas fa-spinner"></i>
    <p>Loading...</p>
  </div>
  
  <!-- QR Code Modal -->
  <div id="qr-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-qrcode"></i> QR Code</h2>
        <button class="close-btn" onclick="closeQRModal()">&times;</button>
      </div>
      <div id="qr-code-display" style="text-align: center; margin: 20px 0;"></div>
      <p id="qr-product-name" style="text-align: center; font-family: 'Poppins', sans-serif; font-weight: 600; color: #333;"></p>
    </div>
  </div>
  
  <!-- Add Product Modal -->
  <div id="add-product-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-plus"></i> Add New Product</h2>
        <button class="close-btn" onclick="closeAddProductModal()">&times;</button>
      </div>
      <form id="add-product-form" onsubmit="return false;">
        <div class="form-group" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: #333;">SKU</label>
          <input type="text" id="product-sku" placeholder="e.g., P001" style="width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 6px; font-family: 'Open Sans', sans-serif; font-size: 14px;" required>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: #333;">Product Name</label>
          <input type="text" id="product-name" placeholder="e.g., Kopi Arabica" style="width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 6px; font-family: 'Open Sans', sans-serif; font-size: 14px;" required>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: #333;">Category</label>
          <select id="product-category" style="width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 6px; font-family: 'Open Sans', sans-serif; font-size: 14px; background: white;" required>
            <option value="F&B">F&B</option>
            <option value="Retail">Retail</option>
            <option value="Jasa">Jasa</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: #333;">Unit</label>
          <select id="product-unit" style="width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 6px; font-family: 'Open Sans', sans-serif; font-size: 14px; background: white;" required>
            <option value="kg">kg</option>
            <option value="liter">liter</option>
            <option value="pcs">pcs</option>
            <option value="botol">botol</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: #333;">Purchase Price (Rp)</label>
          <input type="number" id="product-purchase-price" placeholder="0" style="width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 6px; font-family: 'Open Sans', sans-serif; font-size: 14px;" required>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: #333;">Selling Price (Rp)</label>
          <input type="number" id="product-selling-price" placeholder="0" style="width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 6px; font-family: 'Open Sans', sans-serif; font-size: 14px;" required>
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: #333;">Minimum Stock</label>
          <input type="number" id="product-min-stock" placeholder="10" style="width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 6px; font-family: 'Open Sans', sans-serif; font-size: 14px;" required>
        </div>
        <button type="submit" onclick="addProduct()" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #4CAF50, #45a049); color: white; border: none; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;">
          <i class="fas fa-plus" style="margin-right: 8px;"></i> Add Product
        </button>
      </form>
    </div>
  </div>
  
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><i class="fas fa-box"></i> Mula Inventory</h1>
    </div>
    
    <div class="sidebar-nav">
      <a class="nav-link active" onclick="switchView('dashboard', event)">
        <i class="fas fa-th-large"></i>
        <span>Dashboard</span>
      </a>
      <a class="nav-link" onclick="switchView('products', event)">
        <i class="fas fa-boxes"></i>
        <span>Products</span>
      </a>
      <a class="nav-link" onclick="switchView('transactions', event)">
        <i class="fas fa-exchange-alt"></i>
        <span>Transactions</span>
      </a>
      <a class="nav-link" onclick="switchView('reports', event)">
        <i class="fas fa-chart-line"></i>
        <span>Reports</span>
      </a>
      <a class="nav-link" onclick="switchView('settings', event)">
        <i class="fas fa-cog"></i>
        <span>Settings</span>
      </a>
    </div>
    
    <div class="quick-actions">
      <h3>QUICK ACTIONS</h3>
      <button class="quick-action-btn" onclick="openAddProductModal()">
        <i class="fas fa-plus"></i>
        <span>Add Product</span>
      </button>
      <button class="quick-action-btn" onclick="alert('Stock In feature coming soon!')">
        <i class="fas fa-arrow-down"></i>
        <span>Stock In</span>
      </button>
      <button class="quick-action-btn" onclick="alert('Stock Out feature coming soon!')">
        <i class="fas fa-arrow-up"></i>
        <span>Stock Out</span>
      </button>
      <button class="quick-action-btn" onclick="alert('Barcode Scanner feature coming soon!')">
        <i class="fas fa-barcode"></i>
        <span>Scan Barcode</span>
      </button>
    </div>
    
    <div class="sidebar-profile">
      <div class="profile-avatar">ZA</div>
      <div class="profile-info">
        <h4>Zaky Arisandhi</h4>
        <p>zaky@mulalabs.id</p>
      </div>
    </div>
  </div>
  
  <!-- Main Content (Views will be loaded here) -->
  <div class="main-content" id="main-content">
    <!-- Views loaded dynamically -->
  </div>
  
  <script>
    // Global variables
    let currentView = 'dashboard';
    
    // Load view dynamically
    function switchView(view, event) {
      currentView = view;
      
      // Update active nav link
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
      });
      if (event) {
        event.target.closest('.nav-link').classList.add('active');
      }
      
      // Hide sidebar on mobile
      document.getElementById('sidebar').classList.remove('active');
      
      // Load view
      loadView(view);
    }
    
    // Load view from file
    function loadView(view) {
      const mainContent = document.getElementById('main-content');
      mainContent.innerHTML = '<div class="loading" style="display: block;"><i class="fas fa-spinner"></i><p>Loading...</p></div>';
      
      // Load view content
      google.script.run
        .withSuccessHandler(function(content) {
          mainContent.innerHTML = content;
        })
        .withFailureHandler(function(error) {
          console.error('Error loading view:', error);
          mainContent.innerHTML = '<p style="text-align: center; padding: 40px; color: #999;">Error loading view: ' + error.message + '</p>';
        })
        .getHtml(view);
    }
    
    // Load QR code
    function generateQRCode(sku) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            const url = response.data.url;
            
            // Clear previous QR code
            const qrDisplay = document.getElementById('qr-code-display');
            qrDisplay.innerHTML = '';
            
            // Generate QR code
            new QRCode(qrDisplay, {
              text: url,
              width: 128,
              height: 128,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.H
            });
            
            // Set product name
            document.getElementById('qr-product-name').textContent = response.data.nama;
            
            // Show modal
            document.getElementById('qr-modal').classList.add('active');
            
            showNotification('QR code generated successfully!', 'success');
          } else {
            showNotification('Error: ' + response.message, 'error');
          }
        })
        .withFailureHandler(function(error) {
          showNotification('Error generating QR code: ' + error.message, 'error');
        })
        .generateQRCode(sku);
    }
    
    // Add product
    function addProduct() {
      const sku = document.getElementById('product-sku').value.trim();
      const nama = document.getElementById('product-name').value.trim();
      const kategori = document.getElementById('product-category').value;
      const satuan = document.getElementById('product-unit').value;
      const hargaBeli = parseInt(document.getElementById('product-purchase-price').value);
      const hargaJual = parseInt(document.getElementById('product-selling-price').value);
      const minStok = parseInt(document.getElementById('product-min-stock').value);
      
      if (!sku || !nama || !hargaBeli || !hargaJual || !minStok) {
        showNotification('Please fill all required fields', 'error');
        return;
      }
      
      const productData = {
        sku: sku,
        nama: nama,
        kategori: kategori,
        satuan: satuan,
        hargaBeli: hargaBeli,
        hargaJual: hargaJual,
        minStok: minStok
      };
      
      google.script.run
        .withSuccessHandler(function(response) {
          showNotification(response.message || 'Product added successfully!', 'success');
          closeAddProductModal();
          document.getElementById('add-product-form').reset();
          
          // Reload current view
          loadView(currentView);
        })
        .withFailureHandler(function(error) {
          showNotification('Error: ' + error.message, 'error');
        })
        .addProduct(productData);
    }
    
    // Toggle sidebar (mobile)
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
    }
    
    // Open add product modal
    function openAddProductModal() {
      document.getElementById('add-product-modal').classList.add('active');
    }
    
    // Close add product modal
    function closeAddProductModal() {
      document.getElementById('add-product-modal').classList.remove('active');
    }
    
    // Close QR modal
    function closeQRModal() {
      document.getElementById('qr-modal').classList.remove('active');
    }
    
    // Show notification
    function showNotification(message, type) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.className = 'notification ' + type;
      notification.style.display = 'block';
      
      setTimeout(function() {
        notification.style.display = 'none';
      }, 3000);
    }
    
    // Initialize on load
    document.addEventListener('DOMContentLoaded', function() {
      loadView('dashboard');
    });
  </script>
</body>
</html>
